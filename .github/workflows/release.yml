name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, and example smoke
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Verify packed package
        if: matrix.node-version == 22
        run: pnpm package:check

      - name: Audit moderate and higher severity dependencies
        if: matrix.node-version == 22
        run: pnpm audit:ci

  release-mode:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.existing_state.outputs.mode || steps.detect.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Detect changesets or registry state
        id: detect
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "mode=version" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package_name="$(node -p "require('./package.json').name")"
          expected_version="$(node -p "require('./package.json').version")"
          actual_version="$(npm view "$package_name@$expected_version" version --json --registry=https://registry.npmjs.org 2>/dev/null | tr -d '"' || true)"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$expected_version" >> "$GITHUB_OUTPUT"

          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify existing npm provenance
        id: existing_provenance
        if: steps.detect.outputs.published == 'true'
        uses: ./.github/actions/verify-npm-provenance
        with:
          package-name: ${{ steps.detect.outputs.package_name }}
          package-version: ${{ steps.detect.outputs.package_version }}
          repository-url: https://github.com/${{ github.repository }}
          workflow-path: .github/workflows/release.yml
          workflow-ref: refs/heads/main

      - name: Reconcile existing release state
        id: existing_state
        if: steps.detect.outputs.published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_COMMIT: ${{ steps.existing_provenance.outputs.commit }}
          PACKAGE_VERSION: ${{ steps.detect.outputs.package_version }}
        run: |
          set -euo pipefail
          tag_name="v$PACKAGE_VERSION"
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" --jq '.object.type' 2>/dev/null || true)"
          tag_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" --jq '.object.sha' 2>/dev/null || true)"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag_name" 2>/dev/null || true)"

          if [[ -z "$tag_target" || -z "$release_json" ]]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for _depth in {1..5}; do
            if [[ "$tag_type" != "tag" ]]; then
              break
            fi
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_target")"
            tag_type="$(jq -er '.object.type' <<< "$tag_object")"
            tag_target="$(jq -er '.object.sha' <<< "$tag_object")"
          done

          if [[ "$tag_type" != "commit" || "$tag_target" != "$PROVENANCE_COMMIT" ]]; then
            echo "The release tag does not match the commit verified from npm provenance." >&2
            exit 1
          fi
          if ! jq -e --arg tag "$tag_name" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            <<< "$release_json" >/dev/null; then
            echo "The existing GitHub Release is not a final release for the exact tag." >&2
            exit 1
          fi

          echo "mode=noop" >> "$GITHUB_OUTPUT"

  version:
    needs:
      - verify
      - release-mode
    if: needs.release-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Release PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ secrets.CHANGESETS_GITHUB_TOKEN || github.token }}
          version: pnpm version-packages

  publish:
    needs:
      - verify
      - release-mode
    if: needs.release-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm publish identity
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NPM_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is required for publish mode." >&2
            exit 1
          fi

          npmrc="$RUNNER_TEMP/evalrail-npmrc"
          trap 'rm -f "$npmrc"' EXIT
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$npmrc"

          publisher="$(NPM_CONFIG_USERCONFIG="$npmrc" npm whoami --registry=https://registry.npmjs.org)"
          if [[ "$publisher" != "jamiojala" ]]; then
            echo "The configured npm token does not belong to the expected publisher." >&2
            exit 1
          fi

      - name: Publish package
        continue-on-error: true
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          pnpm release

      - name: Remove npm credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc"

      - name: Wait for exact npm package metadata
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          expected_version="$(node -p "require('./package.json').version")"

          for attempt in {1..12}; do
            actual_version="$(npm view "$package_name@$expected_version" version --json --registry=https://registry.npmjs.org 2>/dev/null | tr -d '"' || true)"
            integrity="$(npm view "$package_name@$expected_version" dist.integrity --json --registry=https://registry.npmjs.org 2>/dev/null | tr -d '"' || true)"
            attestation_url="$(npm view "$package_name@$expected_version" dist.attestations.url --json --registry=https://registry.npmjs.org 2>/dev/null | tr -d '"' || true)"
            if [[ "$actual_version" == "$expected_version" && "$integrity" == sha512-* && -n "$attestation_url" && "$attestation_url" != "null" ]]; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "The exact package version, integrity, and attestation URL were not visible in npm." >&2
              exit 1
            fi
            sleep 5
          done

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$expected_version" >> "$GITHUB_OUTPUT"

      - name: Verify npm registry signature and provenance
        id: provenance
        uses: ./.github/actions/verify-npm-provenance
        with:
          package-name: ${{ steps.registry.outputs.package_name }}
          package-version: ${{ steps.registry.outputs.package_version }}
          repository-url: https://github.com/${{ github.repository }}
          workflow-path: .github/workflows/release.yml
          workflow-ref: refs/heads/main

      - name: Reconcile tag and final GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_COMMIT: ${{ steps.provenance.outputs.commit }}
          PACKAGE_NAME: ${{ steps.registry.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.registry.outputs.package_version }}
        run: |
          set -euo pipefail
          package_name="$PACKAGE_NAME"
          expected_version="$PACKAGE_VERSION"
          tag_name="v$expected_version"

          if [[ "$PROVENANCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "The npm provenance commit does not match this publishing run." >&2
            exit 1
          fi

          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" --jq '.object.type' 2>/dev/null || true)"
          tag_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag_name" --jq '.object.sha' 2>/dev/null || true)"

          if [[ -z "$tag_target" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag_name" -f sha="$GITHUB_SHA" >/dev/null
            tag_type="commit"
            tag_target="$GITHUB_SHA"
          fi

          for _depth in {1..5}; do
            if [[ "$tag_type" != "tag" ]]; then
              break
            fi
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_target")"
            tag_type="$(jq -er '.object.type' <<< "$tag_object")"
            tag_target="$(jq -er '.object.sha' <<< "$tag_object")"
          done

          if [[ "$tag_type" != "commit" || "$tag_target" != "$PROVENANCE_COMMIT" ]]; then
            echo "The release tag does not point to the publishing commit." >&2
            exit 1
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag_name" >/dev/null 2>&1; then
            release_notes="$(awk -v version="$expected_version" '
              $0 == "## " version { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md)"
            if [[ -z "${release_notes//[[:space:]]/}" ]]; then
              release_notes="Release $expected_version of $package_name."
            fi
            gh release create "$tag_name" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag_name" --notes "$release_notes"
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag_name")"
          if ! jq -e --arg tag "$tag_name" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            <<< "$release_json" >/dev/null; then
            echo "GitHub Release reconciliation did not produce an exact final release." >&2
            exit 1
          fi
